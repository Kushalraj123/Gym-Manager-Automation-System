services:
  - type: web
    name: gym-manager-automation-system
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Kolkata
      - key: MONGODB_DB_NAME
        value: gym_manager_saas
      - key: MONGODB_URI
        sync: false
